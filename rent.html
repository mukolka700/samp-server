<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Оренда мопеда</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Inter, Arial, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
        .wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .window { width: 430px; padding: 24px; border-radius: 22px; background: rgba(15, 18, 27, 0.85); backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45); color: #fff; }
        .title { font-size: 26px; font-weight: 800; }
        .subtitle { margin-top: 6px; color: rgba(255, 255, 255, 0.55); font-size: 13px; }
        .badge { display: inline-block; margin-top: 12px; padding: 7px 10px; border-radius: 999px; background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.18); font-size: 11px; font-weight: 800; }
        .card { margin-top: 18px; border-radius: 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); padding: 16px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; color: rgba(255, 255, 255, 0.72); }
        .row b { color: #fff; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
        button { border: 0; border-radius: 14px; padding: 13px 16px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.18s; }
        #rent { background: linear-gradient(135deg, #22c55e, #0ea5e9); color: #fff; }
        #rent:hover { transform: translateY(-1px); filter: brightness(1.06); }
        #unrent { background: linear-gradient(135deg, #f97316, #ef4444); color: #fff; }
        #unrent:hover { transform: translateY(-1px); filter: brightness(1.06); }
        #close { grid-column: span 2; background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.09); }
        #close:hover { background: rgba(255, 255, 255, 0.13); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="window">
            <div class="title">Оренда мопеда</div>
            <div class="subtitle">NPC біля вокзалу • open.mp CEF UI</div>
            <span class="badge">ВОКЗАЛ ОРЕНДА</span>

            <div class="card">
                <div class="row"><span>Транспорт</span><b>Faggio / Мопед</b></div>
                <div class="row"><span>ID моделі</span><b>462</b></div>
                <div class="row"><span>Вартість</span><b>$50</b></div>
            </div>

            <div class="actions">
                <button id="rent">Орендувати</button>
                <button id="unrent">Повернути</button>
                <button id="close">Закрити</button>
            </div>
        </div>
    </div>

    <script>
        // Функція для відправки подій в open.mp CEF
        function sendToServer(event, data) {
            // open.mp CEF зазвичай використовує mp.trigger
            if (typeof mp !== 'undefined' && mp.trigger) {
                mp.trigger(event, data);
            } 
            // Або window.openmp.trigger (в деяких збірках)
            else if (typeof window.openmp !== 'undefined' && window.openmp.trigger) {
                window.openmp.trigger(event, data);
            }
            else {
                console.log("CEF Bridge not found. Event: " + event + ", Data: " + data);
            }
        }

        document.getElementById("rent").addEventListener("click", function () {
            sendToServer("rentAction", "rent");
        });

        document.getElementById("unrent").addEventListener("click", function () {
            sendToServer("rentAction", "unrent");
        });

        document.getElementById("close").addEventListener("click", function () {
            sendToServer("rentAction", "close");
        });
    </script>
</body>
</html>
